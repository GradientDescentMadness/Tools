# =============================================================================
# Candidate Structured Data Profile - TEMPLATE
# =============================================================================
# Replace the example values with your own (or generate this file from your CV with
# 'python run.py --parse-resume my_resume.pdf' / the prompt in 'Resume Parser to YAML.txt').
# Keep your filled-in copy out of version control and point the tool at it:
#   python run.py --resume-data <path>/resume_data_personal.yaml --settings <path>/settings_personal.yaml
# Optimized for ATS FormFillers (Workday, Oracle, SuccessFactors, Taleo) with RapidFuzz support.

personal:
  first_name: "Jane"
  last_name: "Doe"
  full_name: "Jane Doe"
  email: "jane.doe@example.com"
  secondary_email: ""
  phone: "+91-9000000000"
  phone_country_code: "+91"
  salutation: "Ms."
  pronouns: "She/Her"
  address:
    street: "1 Example Street"
    city: "Bangalore"
    state: "Karnataka"
    zip_code: "560001"
    country: "India"
  linkedin_url: "https://www.linkedin.com/in/your-profile"
  portfolio_url: ""
  github_url: ""
  date_of_birth: ""            # DD/MM/YYYY - only used when a form asks for it
  gender: ""
  summary: |
    One-paragraph professional summary.

citizenship:
  country: "India"
  is_citizen_of_applied_country: True
  needs_visa_sponsorship: False
  work_authorized_countries: "India"
  legally_authorized_to_work: True
  require_sponsorship_now_or_future: False

# Voluntary self-identification answers (leave as "I do not wish to answer" if you prefer)
eeoc_and_diversity:
  age_range: ""
  gender_identity: ""
  is_transgender: ""
  sexual_orientation: "I do not wish to answer"
  ethnicity: "I do not wish to answer"
  communities: ""
  veteran_status: "I am not a veteran"
  disability_status: "I do not wish to answer"

# One entry per degree, most recent first. One card/row is added on the portals for each entry.
education:
  - degree: "M.S. in Computer Science"
    degree_aliases: ["MS", "M.S.", "MSc", "Master of Science", "Master's Degree", "Masters Degree", "Masters", "Master"]
    field_of_study: "Computer Science"
    # Tried in order when an ATS list lacks the exact field; then built-in nearest proxies.
    field_of_study_aliases: ["Computer Science and Engineering"]
    field_of_study_fallbacks: ["Computer Engineering", "Information Technology"]
    university: "Example State University"
    university_aliases: ["ESU"]
    location: "Springfield, IL, US"
    qualification_level: "Master's Degree"
    qualification_status: "Completed"
    commencement_date: "01/08/2015"   # DD/MM/YYYY
    completion_date: "01/05/2017"
    graduation_date: "2017-05"
    gpa: ""

  - degree: "B.Tech."
    degree_aliases: ["BTech", "B.Tech", "Bachelor of Technology", "B.S.", "Bachelor of Science", "Bachelor's Degree", "Bachelors", "Bachelor"]
    field_of_study: "Mechanical Engineering"
    field_of_study_aliases: []
    field_of_study_fallbacks: ["Engineering"]
    university: "Example Institute of Technology"
    university_aliases: []
    location: "Pune, India"
    qualification_level: "Bachelor's Degree"
    qualification_status: "Completed"
    commencement_date: "01/08/2009"
    completion_date: "01/06/2013"
    graduation_date: "2013-06"
    gpa: ""

# One entry per job, most recent first.
experience:
  - company: "Example Corp"
    location: "Bangalore, India"     # 'City, Country' - a job row's Country comes from here (or set 'country:')
    title: "Senior Data Scientist"
    industry: "Information Technology / Consulting"   # used for 'Industry' / 'Type of Business'
    start_date: "01/06/2017"
    end_date: "Present"
    is_current: true
    description: |
      - Achievement or responsibility, with a measurable result.
      - Another achievement.

  - company: "Sample Bank Ltd"
    location: "Pune, India"
    title: "Data Analyst"
    industry: "Banking / Financial Services"
    start_date: "01/07/2013"
    end_date: "01/05/2015"
    is_current: false
    description: |
      - Achievement or responsibility, with a measurable result.

achievements:
  - organization: "Example Corp"
    award: "Example award"

certifications:
  - issuer: "Example Issuer"
    name: "Example Certification"

skills:
  categories:
    machine_learning_and_ai: ["Machine Learning", "Deep Learning", "NLP"]
    programming_and_platforms: ["Python", "SQL", "AWS"]
  # Flat list used for skill dropdowns/tags: the skills above plus their synonyms
  technical:
    - "Machine Learning"
    - "Deep Learning"
    - "NLP"
    - "Natural Language Processing"
    - "Python"
    - "SQL"
    - "AWS"
    - "Amazon Web Services"
  soft:
    - "Communication"

languages:
  - language: "English"
    proficiency: "Professional"

additional:
  notice_period: "60 days"
  current_salary: ""
  expected_salary: ""
  salary_currency: "INR"
  willing_to_relocate: true
  years_of_experience: ""
  highest_education: "Master's Degree"
  cover_letter: ""
  resume_file: ""   # your CV, uploaded to CV/resume fields (path relative to 'Python Source')
